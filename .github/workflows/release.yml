name: release
on:
  push:
    tags:
      - rizin-v*_*
  workflow_dispatch:

jobs:
  extract-rizin-version:
    runs-on: ubuntu-24.04
    outputs:
      rizin_version: ${{ steps.extract_version.outputs.result }}
    steps:
      - id: extract_version
        run: echo "result=$(echo ${{ github.ref }} | cut -d'_' -f1 | cut -d'-' -f2-)" >> "$GITHUB_OUTPUT"

  build:
    uses: ./.github/workflows/ci.yml
    needs: [extract-rizin-version]
    with:
      rizin_ref: ${{ needs.extract-rizin-version.outputs.rizin_version }}

  create-release:
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

